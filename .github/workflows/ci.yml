name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trace:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_trace.py

  secrets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  domain:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/domain
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: dart test

  mobile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      # The sqlite3 hook downloads its library from GitHub releases, which fail at times, so keep it between runs.
      # The hook checks the file's hash before using it.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/.dart_tool/hooks_runner/shared/*/build/download-*
          key: hook-downloads-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  # Android builds are slow, so only PRs to main run this.
  android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      # Gradle and the sqlite3 hook download from GitHub releases, which fail at times, so keep both between runs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            apps/mobile/.dart_tool/hooks_runner/shared/*/build/download-*
          key: android-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle.kts', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/pubspec.lock') }}
          restore-keys: android-${{ runner.os }}-
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
