name: labour_app
description: "Labour supply management app."
publish_to: 'none'
version: 0.1.0+1

# Bundles SQLite3MultipleCiphers instead of plain SQLite, so tenant databases can be encrypted.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  domain:
    path: ../../packages/domain
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
