name: labour_app
description: "Labour supply management app."
publish_to: 'none'
version: 0.1.0+1

# Bundles SQLite3MultipleCiphers instead of plain SQLite, so tenant databases can be encrypted.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
